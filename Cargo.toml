[workspace]
members = ["crates/thwaite-core"]

[package]
name = "thwaite"
version = "0.1.0"
edition = "2021"
default-run = "thwaite"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.0"
thwaite-core = { path = "crates/thwaite-core" }

[build-dependencies]
thwaite-core = { path = "crates/thwaite-core" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Build scripts and their dependencies use the dev profile by default, even under `--release`. `thwaite-core` is a
# build-dependency (table generation runs from `build.rs`), so without this override that BFS runs unoptimized -
# 300s becomes tens of minutes.
[profile.release.build-override]
opt-level = 3

[[bench]]
name = "thistlewaite"
harness = false

[[bench]]
name = "kociemba"
harness = false
